[package]
name = "coolder-libai"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
links = "ai_c"
build = "build.rs"
description = "Rust bindings to the portable libai C++ agent SDK"
license = "MIT"

[lib]
name = "libai"
path = "src/lib.rs"

[features]
default = ["rag"]
rag = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1", optional = true, features = ["float_roundtrip"] }
